# ohos 仓库不变量守卫：不需要 HarmonyOS SDK，几秒钟跑完。
#
# 与 ci.yml 分开：真构建要先下载约 2GB 工具链，把「顺手加个 console.log / 删掉一个用例」
# 这类问题挡在更便宜的一层。
name: guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: ohos repo invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check ohos invariants
        run: node packages/ohos-otp/scripts/ci/check-invariants.mjs
